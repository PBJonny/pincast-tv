name: Device Compatibility Report
description: Share your test results running Pinball Buddies Pincast TV on a specific TV stick, Smart TV, or mini-PC.
title: "[Hardware]: "
labels: ["hardware-compatibility"]
body:
  - type: input
    id: device_model
    attributes:
      label: Device Make & Model
      description: Exact hardware model tested.
      placeholder: "e.g., Walmart Onn. Google TV 4K Pro (2024)"
    validations:
      required: true
  - type: input
    id: os_version
    attributes:
      label: TV OS / Firmware Version
      placeholder: "e.g., Android TV 12 / Fire OS 8.1.x"
    validations:
      required: true
  - type: dropdown
    id: install_method
    attributes:
      label: Installation Method Used
      options:
        - 1-Click Wi-Fi Installer (setup-firestick.sh / setup-firestick.bat)
        - Manual ADB Sideload
        - Downloader App / Local File Manager
        - Apple TV (tvOS TestFlight / App Store)
    validations:
      required: true
  - type: checkboxes
    id: verification
    attributes:
      label: Verified Functionality
      description: Check all behaviors that worked as expected on this device.
      options:
        - label: APK installed and verified cleanly
        - label: 8-character pairing code / QR code paired with venue
        - label: Smooth 60fps slide transitions
        - label: 5-way D-Pad remote navigation (Left/Right cycle, Center pause, Back Operator PIN)
        - label: 24/7 anti-sleep / stay-awake settings prevented screen turn-off
        - label: Cold-boot auto-launch after power cycle
  - type: textarea
    id: notes
    attributes:
      label: Notes or Device-Specific Tips
      description: Any special settings or tips other venue operators should know for this device?
