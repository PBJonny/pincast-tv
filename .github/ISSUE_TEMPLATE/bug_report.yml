name: Bug Report / Installation Issue
description: Report a problem installing or running Pinball Buddies Pincast TV.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: dropdown
    id: hardware
    attributes:
      label: Fire TV Hardware
      options:
        - Amazon Fire TV Stick 4K Max
        - Amazon Fire TV Stick 4K
        - Amazon Fire TV Stick HD / Lite
        - Amazon Fire TV Cube / Fire TV Edition Smart TV
        - Other
    validations:
      required: true
  - type: input
    id: host_os
    attributes:
      label: Installer Computer OS
      description: What computer did you run setup-firestick on? (e.g., macOS 15, Windows 11, Ubuntu 24.04)
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Paste any terminal output or describe what is shown on the TV screen.
    validations:
      required: true
